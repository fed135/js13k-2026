<html>
<head><title>JS13kGame: My Little Armaggedon!</title>
    <style>
        * {margin: 0; padding: 0; font-family: 'Courier New', monospace;  user-select: none; }
        body {background-color: #000; display: flex; align-items: center; justify-content: center;}
        h1 { font-size: 6em; font-weight: bolder; text-align: center; animation: rainbow 4s linear infinite; margin-top: 6em;}
        #credits {text-align: center; margin-top: 6em;}
        a {animation: rainbow 4s linear infinite;}
        @keyframes rainbow {
          0% { color: #ff5; }
          33% { color: #5ff; }
          66% { color: #f5f; }
          100% { color: #ff5; }
        }

        #title { position: absolute; background-color: black; color: white; width: 100%; height: 100%; transition: opacity 0.88s ease, display 0.88s ease allow-discrete; top: 0; opacity:1; z-index: 99;}
        .sub {text-align: center;}

        #global {position: absolute; top: 0; right:0; z-index: 999}
        #toggle-audio {font-size: 36px; padding: 8px;}

        #wrapper {position: relative; width: 1600px; height: 900px; flex: none;}
        .hud {position: absolute; inset: 0; display: none;}
        h2 { margin-bottom: 12px; margin-top: 12px;}

        .menu { position: absolute;  border: 6px solid #666; background-color: rgba(188, 188, 188, 0.88); padding: 12px; }
        #picker{  margin-top: 172px; margin-left: 100px;}
        input,input:focus,input:active,select,select:focus,select:active {border: 2px outset black; background-color: #ccc; padding: 3px; outline: none;}
        input:invalid, input:user-invalid {background-color: #333;}
        .i-g { width: 100%; margin-bottom: 12px;}
        #start-match { margin: auto; font-size: 48px; margin-top: 660px; display: block;}
        button:hover {outline: 6px solid #333; border: 12px outset #ccc;}
        button:active {outline: 6px solid #333; border: 12px inset grey; background-color: #666; transform: translateY(4px); }
        button { color: #333; background-color: #999; padding: 0.88em; opacity: 0.88; border: 12px outset grey; outline: 6px solid black; text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px  1px 0 #fff, 1px  1px 0 #fff; font-weight: bold;}

        canvas { image-rendering: pixelated; position: absolute; top: 0; left: 0; width: 1600px; height: 900px; display: block;}

        #game-over { display: none;}
    </style>
</head>
<body>

<div id="global">
    <button id="toggle-audio">&#x1F507;</button>
</div>
<div id="title">
    <h1>MY LITTLE ARMAGEDDON</h1>
    <div class="sub">(click anywhere to start)</div>
    <div id="credits">A 13kb Javascript game by <a href="https://github.com/fed135" target="_blank" onclick="event.stopPropagation();">Frederic Charette</a></div>
</div>
<div id="wrapper">
    <canvas id="canvas">Oops...</canvas>
    <div id="lobby" class="hud">
        <div id="picker" class="menu">
            <h2>CUSTOMIZE YOUR HERO</h2>
            <div class="i-g">
            <label for="name">NAME:</label>
            <input id="name" value="Player" autofocus required placeholder="Type a name!"/>
            </div>

            <div class="i-g">
            <label for="baseColor">HELMET COLOR:</label>
            <input id="baseColor" type="color" oninput="window.updateColor(event)" value="#ffffff" />
            </div>

            <h2>TOURNAMENT INFO</h2>

            <div class="i-g">
            <label for="matchType">MATCH TYPE:</label>
            <select id="matchType"><option>FREE FOR ALL</option></select> 
            </div>

            <div class="i-g">
            <label for="opponents">NUMBER OF OPPONENTS:</label>
            <select id="opponents"><option>1</option><option>2</option><option>4</option><option>8</option><option>12</option><option>16</option></select> 
            </div>
        </div>
        <button id="start-match">START MATCH</button>
    </div>
    <div id="match" class="hud">
        <div id="top-hud">LIFE: 0 <br /> AMMO: 0</div>
        <div id="game-over" class="menu">
            <h2>GAME OVER</h2>
            <button id="return">RETURN TO LOBBY</button>
        </div>
    </div>
</div>
<script type="module" src="./game.js"></script>
</body>
</html>
