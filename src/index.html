<html>
<head><title>JS13kGame: My Little Armaggedon!</title>
    <style>
        * {--bg: #999; --bgLite: #ccc; --bgDark: #666; margin: 0; padding: 0; font-family: 'Courier New', monospace;  user-select: none; font-smooth: none; }
        body {background-color: #000; display: flex; align-items: center; justify-content: center;}
        h1 { font-size: 6em; font-weight: bolder; text-align: center; animation: rainbow 4s linear infinite; margin-top: 6em;}
        #credits {text-align: center; margin-top: 6em;}
        a {animation: rainbow 4s linear infinite;}
        @keyframes rainbow {
          0% { color: #ff5; }
          33% { color: #5ff; }
          66% { color: #f5f; }
          100% { color: #ff5; }
        }

        #title, #match { position: absolute; color: white; width: 100%; height: 100%; transition: opacity 0.88s ease, display 0.88s ease allow-discrete; top: 0; opacity:1; z-index: 99;}
        #accept-invite {position: absolute; background-color: rgba(0,0,0,0.4); color: white; width: 100%; height: 100%; z-index: 999;}
        #accept-invite .menu {margin: auto;position: relative; width: fit-content;text-align: center; margin-top: 372px;}

        .sub {text-align: center;}

        #global {position: absolute; top: 0; right:0; z-index: 999}
        #toggle-audio {font-size: 36px; padding: 8px;}

        #wrapper {position: relative; width: 1600px; height: 900px; flex: none;}
        .hud {position: absolute; inset: 0; display: none;}
        h2 { margin-bottom: 12px; margin-top: 12px;}

        .menu { position: absolute;  border: 6px solid #666; background-color: rgba(188, 188, 188, 0.88); padding: 12px; }
        .mp {display:none;}
        #picker{  margin-top: 172px; margin-left: 100px;}
        #invite{margin-top: 172px;margin-left: 960px;}
        input,input:focus,input:active,select,select:focus,select:active {border: 2px outset black; background-color: var(--bg); padding: 3px; outline: none;}
        input:invalid, input:user-invalid {background-color: var(--bgDark);}
        .i-g { width: 100%; margin-bottom: 12px;}
        #start-match { margin: auto; font-size: 48px; margin-top: 660px; display: block;}
        button:hover {outline: 6px solid var(--bgDark); border: 12px outset var(--bgLite);}
        button:active {outline: 6px solid var(--bgDark); border: 12px inset var(--bgDark); background-color: var(--bg); transform: translateY(4px); }
        button { color: #333; background-color: var(--bg); padding: 0.88em; opacity: 0.88; border: 12px outset var(--bg); outline: 6px solid black; text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px  1px 0 #000, 1px  1px 0 #000; font-weight: bold;}

        .green {--bg: #090; --bgDark: #060; --bgLite: #0c0; color: white}
        .red {--bg: #900; --bgDark: #600; --bgLite: #c00; color: white}

        canvas { image-rendering: pixelated; position: absolute; top: 0; left: 0; width: 1600px; height: 900px; display: block;}

        #bottom-hud { bottom: 0; position: absolute; height: 100px; background-color: rgba(128, 128, 128, 0.9); width: calc(100% - 24px); border: 2px solid black; padding: 10px;}
        #speedometer, #fuelometer {width: 80%; border: 2px solid black; margin: 10px auto; height: 30px; background-color: #333;}
        #current-speed { background-color: darkred; border: 4px darkred inset; height: 22px;}
        #current-fuel { background-color: darkblue; border: 4px darkblue inset; height: 22px;}
        #top-hud { top:0; position: absolute; height:52px; background-color: rgba(128, 128, 128, 0.9); width: calc(100% - 4px); border: 2px solid black; color:#000;}
        #game-over { display: none;}

        #announcer {
            display: none;
            position: absolute;
            z-index: 999;
            animation: toast 3s forwards;
            margin:100px auto;
            font-size: 48px;
            color: white;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px  1px 0 #000, 1px  1px 0 #000;
            width: 100vw;
            text-align: center;
        }
        .mini-toast {
            display: none;
            position: absolute;
            bottom: 120%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,200,0,0.7);
            color: #fff;
            padding: 16px 0px;
            border-radius: 4px;
            font: 18px sans-serif;
            font-weight: bold;
            text-align: center;
            width: 100%;
            white-space: nowrap;
            animation: toast 3s forwards;

            }

            @keyframes toast {
                0%   { opacity: 0; transform: translate(-50%, 5px); }
                10%  { opacity: 1; transform: translate(-50%, 0); }
                85%  { opacity: 1; transform: translate(-50%, 0); }
                100% { opacity: 0; transform: translate(-50%, -5px); }
            }
    </style>
</head>
<body>

<div id="global">
    <button id="toggle-audio">&#x1F507;</button>
</div>
<div id="title">
    <h1>MY LITTLE ARMAGEDDON</h1>
    <div class="sub">(click anywhere to start)</div>
    <div id="credits">A 13kb Javascript game by <a href="https://github.com/fed135" target="_blank" onclick="event.stopPropagation();">Frederic Charette</a></div>
</div>

<div id="accept-invite" class="mp">
    <div class="menu">
        <h2>JOIN MATCH?</h2>

        <button id="join" class="green">YES!</button>
        <button id="decline" class="red">DECLINE</button>
    </div>
</div>
<div id="wrapper">
    <canvas id="canvas">Oops...</canvas>
    <div id="lobby" class="hud">
        <div id="picker" class="menu">
            <h2>CUSTOMIZE YOUR HERO</h2>
            <div class="i-g">
            <label for="name">NAME:</label>
            <input id="name" value="Player" autofocus required placeholder="Type a name!" oninput="window.updateName(event)"/>
            </div>

            <div class="i-g">
            <label for="baseColor">HELMET COLOR:</label>
            <input id="baseColor" type="color" oninput="window.updateColor(event)" value="#ffffff" />
            </div>

            <!--h2>TOURNAMENT INFO</h2>

            <div class="i-g">
            <label for="matchType">MATCH TYPE:</label>
            <select id="matchType"><option>FREE FOR ALL</option></select> 
            </div>

            <div class="i-g">
            <label for="opponents">NUMBER OF OPPONENTS:</label>
            <select id="opponents"><option>1</option><option>2</option><option>4</option><option>8</option><option>12</option><option>16</option></select> 
            </div-->
        </div>

        <div id="invite" class="menu mp">
            <h2>INVITE YOUR FRIENDS</h2>
            <input type="hidden" id="invite-link"></pre>
            <button id="copy-link">COPY INVITE LINK</button>
            <div class="mini-toast" onanimationend="this.style.display='none'">COPIED!</div>
        </div>
        <button id="start-match">START MATCH</button>
    </div>
    <div id="match" class="hud">
        <div id="announcer"></div>
        <div id="top-hud">
            <div id="current-life">0</div>
            <div id="current-ammo">0</div>
            <div id="current-weapon">rainbow</div>
            <div id="turn-timer">0</div>
        </div>
        <div id="bottom-hud">
            <div id="current-angle"></div>
            <div id="speedometer">
                <div id="current-speed"></div>
            </div>
            <div id="fuelometer">
                <div id="current-fuel"></div>
            </div>
        </div>
        <div id="game-over" class="menu">
            <h2>GAME OVER</h2>
            <button id="return">RETURN TO LOBBY</button>
        </div>
    </div>
</div>
<script type="module" src="./game.js"></script>
</body>
</html>
